// Local Expo module — never published to a Maven repo.
//
// That last part is load-bearing. expo-module-gradle-plugin runs applyPublishing
// by default, which builds a MavenPublication from the module. Doing that needs
// two things a local library does not have:
//
//   * android.defaultConfig.versionName — AGP 8 removed versionName from the
//     LIBRARY DSL entirely, so it cannot be supplied. Setting it changes
//     nothing; the read still returns null.
//   * a 'release' SoftwareComponent, which only exists once publishing is
//     configured.
//
// Both surfaced as the EAS failure:
//
//   Failed to apply plugin 'expo-autolinking'.
//     > A problem occurred configuring project ':tulmi-bridge'.
//       > 'android.defaultConfig.versionName' is not defined
//   A problem occurred configuring project ':expo'.
//     > SoftwareComponent with name 'release' not found.
//
// canBePublished false skips that path — the same escape expo-constants uses.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tulmibridge'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace "expo.modules.tulmibridge"
  defaultConfig {
    minSdkVersion 24
  }
}
