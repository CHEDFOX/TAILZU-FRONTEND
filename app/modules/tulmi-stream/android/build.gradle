apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.tulmistream'
version = '1.0.0'

// See tulmi-bridge for the full explanation: this module is never published to
// a Maven repo, and the plugin's default publishing path needs a versionName
// the AGP 8 library DSL cannot provide.
expoModule {
  canBePublished false
}

android {
  namespace "expo.modules.tulmistream"
  defaultConfig {
    minSdkVersion 24
    // What R8 may not rename away: the live client's options class, which the
    // call's echo canceller reaches by name (consumer-rules.pro).
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // OkHttp ships with React Native; pin it so this library module compiles
  // standalone. Gradle resolves to a single version on the app classpath.
  implementation "com.squareup.okhttp3:okhttp:4.12.0"

  // NO DEPENDENCY ON THE LIVE CALL'S CLIENT, on purpose. The software echo
  // canceller (CallAec.kt) reaches react-native-webrtc's options
  // object by name, through reflection, so this module — which is the keyboard
  // and dictation module too — keeps compiling whether or not that client is in
  // the build, and a build without it simply keeps the phone's own canceller.
}
