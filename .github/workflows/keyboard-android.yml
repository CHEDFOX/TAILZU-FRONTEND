name: keyboard-android-compile

# Compile-checks the Android keyboard (Kotlin) WITHOUT an EAS build, so native
# errors surface in seconds on a free ubuntu runner instead of after a paid,
# 20-minute EAS build. Runs the full Expo prebuild + a debug native compile,
# which pulls in the local `tulmi-keyboard` module (Stream.kt, TulmiAudioFx.kt,
# SDUIRenderer.kt, …).
#
# Only runs when native Android / config surface changes — pure-JS commits skip
# it. Trigger manually from the Actions tab via "Run workflow" too.

on:
  push:
    paths:
      - "app/modules/tulmi-keyboard/android/**"
      - "app/android/**"
      - "app/app.config.ts"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/keyboard-android.yml"
  pull_request:
    paths:
      - "app/modules/tulmi-keyboard/android/**"
      - "app/android/**"
      - "app/app.config.ts"
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/keyboard-android.yml"
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS deps
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Compile native (debug) — catches Kotlin errors
        working-directory: app/android
        # assembleDebug compiles the app AND every autolinked module (incl. the
        # tulmi-keyboard Kotlin) but does not bundle JS, so it stays fast and
        # needs no signing.
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace
