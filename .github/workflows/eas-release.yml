# Phone releases, started from GitHub.
#
# A manual run (Actions → EAS Release → Run workflow) does what is ticked:
#   update  — an over-the-air update of the JavaScript to installed phones.
#   ios     — a store build, sent on to App Store Connect / TestFlight.
#   android — a store build (.aab). eas.json has no Play credentials, so it is
#             uploaded in Play Console by hand.
#   nothing — a check that everything a release needs is in place (the token,
#             the keys, the channel, the bundle, the Mac runner). Releases
#             nothing.
# and "builder" says whose machine builds:
#   github — this repo's Actions minutes (`eas build --local`); no Expo build
#            is used up. iOS runs on a macOS runner, which a private repo pays
#            for at about ten times the Linux rate; Android runs on Linux.
#   expo   — Expo's cloud, counted against the Expo plan's monthly builds.
# Either way Expo keeps the signing credentials and the build number, and EAS
# Submit does the TestFlight upload (for a GitHub build, from a Linux job, so
# the wait is not paid at the Mac rate).
#
# A push to main sends an update, never a build, and only when it touched no
# native file (see "Native files untouched"). runtimeVersion is a fixed string
# (app.config.ts), so nothing else stops JavaScript written for new native
# code from reaching a binary that lacks it.
#
# Updates and GitHub builds read the EAS "production" environment from here,
# where a "secret" variable cannot be read. Nothing about billing is checked:
# the keys are not in the bundle at all (app.config.ts says why).
#
# A push that cannot be delivered over the air FAILS the run. It used to warn
# and finish green, which is how a release that reached nobody looked exactly
# like one that worked.
#
# Requirements (one-time, repo settings → Secrets and variables → Actions):
#   EXPO_TOKEN — an Expo access token (expo.dev → Account settings → Access
#                tokens) for the account that owns this EAS project.
# Apple credentials (distribution cert + ASC API key) and the Android keystore
# must already live in EAS (they do after the first cloud build / submit).
# Without EXPO_TOKEN every job is skipped.
name: EAS Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      update:
        description: "Publish an over-the-air update (JavaScript only)"
        type: boolean
        default: true
      ios:
        description: "Build iOS and send it to TestFlight"
        type: boolean
        default: false
      android:
        description: "Build Android (.aab; Play upload is by hand)"
        type: boolean
        default: false
      builder:
        description: "Who builds: github (Actions minutes) or expo (Expo's monthly builds)"
        type: choice
        options: [github, expo]
        default: github
      message:
        description: "What the update is, shown on expo.dev"
        type: string
        default: "Update"

concurrency:
  group: eas-release-${{ github.ref }}
  cancel-in-progress: false # never cancel a store build mid-flight

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - id: gate
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::No EXPO_TOKEN secret, so nothing was released. Add it in repo settings to release from here."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  # Nothing ticked: would a release work? Releases nothing, and prints names
  # and states, never a variable's value or a download link.
  check:
    needs: gate
    if: needs.gate.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && !inputs.update && !inputs.ios && !inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Token and project
        working-directory: app
        run: |
          npx eas-cli@latest whoami
          npx eas-cli@latest project:info

      - name: Update channel
        working-directory: app
        run: npx eas-cli@latest channel:view production --non-interactive

      - name: Last store builds
        working-directory: app
        run: |
          npx eas-cli@latest build:list --limit 4 --json --non-interactive | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              for (const b of JSON.parse(s)) console.log([b.platform, b.status, b.appVersion + " (" + b.appBuildVersion + ")", b.runtimeVersion, b.channel, b.createdAt].join("  "));
            });'

      - name: The update would bundle
        working-directory: app
        run: npx eas-cli@latest env:exec production "npx expo export --platform ios --platform android --output-dir $RUNNER_TEMP/export" --non-interactive

      - name: Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -n 2

  check-mac:
    needs: gate
    if: needs.gate.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && !inputs.update && !inputs.ios && !inputs.android
    runs-on: macos-latest
    steps:
      - name: Xcode 26, CocoaPods, fastlane
        run: |
          sw_vers -productVersion
          ls -d /Applications/Xcode_26*.app | grep -vi beta
          pod --version
          fastlane --version | tail -n 1

  # The TypeScript marked regions: the bot tiles' numeric grammar and the screen kernel's copy of it
  # (tools/ci/marked-regions.mjs). It lives here because this workflow is the one that watches `app/**`, which is
  # where both copies are, and it needs no EXPO_TOKEN — so it also runs on a repo with no release secrets.
  # `update` waits for it, so an over-the-air update can never ship a drifted copy.
  marked-regions-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/ci/marked-regions.mjs --lang TS

  update:
    needs: [gate, marked-regions-ts]
    if: needs.gate.outputs.ok == 'true' && (github.event_name == 'push' || inputs.update)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Native files untouched
        id: native
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        # A RELEASE THAT SENT NOTHING IS RED, NOT GREEN.
        #
        # This used to set send=false and exit 0, so every later step skipped and the run finished with a green tick.
        # Nothing had failed and nothing had shipped, and the only way to find out was to notice days later that the
        # app had not changed — which is exactly how Android being left out of every update went unnoticed for two
        # months. A commit that is on main but not on anybody's phone is a thing somebody has to act on, so it says so.
        #
        # What to do when this fails is in the summary: a store build for a real native change, or run the workflow by
        # hand (where this check does not apply) when the file on the list was touched for something an update can
        # carry — removing a value from `extra`, say, with runtimeVersion unmoved.
        run: |
          stop() {
            {
              echo "### No update was sent"
              echo ""
              echo "$1"
              echo ""
              echo "**The commit is on \`main\` but not on any phone.** Either:"
              echo ""
              echo "- it needs a **store build** — run this workflow by hand with \`ios\` and/or \`android\` ticked; or"
              echo "- an over-the-air update really can carry it (nothing native actually moved, \`runtimeVersion\`"
              echo "  unchanged) — run this workflow by hand with just \`update\`, which skips this check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "::error::No update was sent, so this commit is not on any phone. See the run summary."
            exit 1
          }
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            stop "There is no earlier commit to compare against, so which files changed could not be worked out."
          fi
          # react-native.config.js is on the list because it decides whether
          # Health Connect is linked into the Android binary at all.
          hit=$(git diff --name-only "$BEFORE" HEAD | grep -E '^app/(targets|modules|plugins|ios|android)/|^app/(app\.config\.ts|react-native\.config\.js|package\.json|package-lock\.json|eas\.json)$' || true)
          if [ -n "$hit" ]; then
            echo "$hit"
            stop "These files can carry native changes, which an over-the-air update cannot deliver:$(printf '\n- `%s`' $hit)"
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"

      # Needs no npm install: without node_modules the package list comes from
      # the lock and versions from package-lock.json.
      - name: Runtime label matches native inputs
        if: github.event_name == 'push'
        run: node tools/ci/check-runtime.mjs

      - uses: actions/setup-node@v4
        if: steps.native.outputs.send != 'false'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        if: steps.native.outputs.send != 'false'
        working-directory: app
        run: npm ci

      # NOTHING ABOUT BILLING IS CHECKED HERE, ON PURPOSE.
      #
      # This job used to read the RevenueCat keys and drop any platform whose key it could not get, because
      # `eas update` re-bakes app.config.ts and would have replaced a working key in the manifest with an empty
      # string. A variable stored as "secret" on expo.dev reads empty through `eas env:exec`, so ANDROID WAS
      # DROPPED FROM EVERY UPDATE for two months while the run stayed green on a warning.
      #
      # The keys are not in the manifest any more (app.config.ts says why): the server sends them and the app takes
      # them at boot. There is nothing here for a publish to lose, so there is nothing here to check — and a payment
      # integration has no business deciding who receives JavaScript.
      - name: EAS update (over the air, production)
        if: steps.native.outputs.send != 'false'
        working-directory: app
        # Through env, never pasted into the script: both are free text.
        env:
          MSG: ${{ github.event_name == 'push' && github.event.head_commit.message || inputs.message }}
        run: npx eas-cli@latest update --channel production --environment production --platform all --message "${MSG%%$'\n'*}" --non-interactive

      - name: What went out
        if: steps.native.outputs.send != 'false'
        run: |
          {
            echo "### Over-the-air update"
            echo ""
            echo "Published for **all platforms** on channel \`production\`."
            echo ""
            echo "Billing keys are not in this bundle and never will be: the server sends them at boot"
            echo "(app.config.ts says why). Nothing about a payment integration gates a release."
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    needs: gate
    if: needs.gate.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: ${{ inputs.builder == 'github' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # Apple refuses a version that is not above the one already approved,
      # but only after the build: ask the App Store before building.
      - name: Version above the App Store's
        run: node tools/ci/ios-version.mjs

      # --no-wait: queued, and EAS builds in its own cloud and submits on
      # success. The job going green means "queued"; the build is on expo.dev.
      - name: Build on Expo's cloud, then TestFlight
        if: inputs.builder == 'expo'
        working-directory: app
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --no-wait --auto-submit

      # App Store Connect takes only builds made with Xcode 26 or later.
      - name: Xcode 26
        if: inputs.builder == 'github'
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n1)
          if [ -z "$XC" ]; then echo "::error::This runner has no Xcode 26. Run again with builder: expo."; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Build on this runner
        if: inputs.builder == 'github'
        working-directory: app
        run: npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/tailzu.ipa"

      - uses: actions/upload-artifact@v4
        if: inputs.builder == 'github'
        with:
          name: tailzu-ios
          path: ${{ runner.temp }}/tailzu.ipa
          retention-days: 7
          if-no-files-found: error

  ios-submit:
    needs: ios
    if: inputs.builder == 'github'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: tailzu-ios
          path: ${{ runner.temp }}

      - name: Send to TestFlight
        working-directory: app
        # On failure the full eas error sits on Expo's log host, outside this
        # run, so the key lines are echoed as a GitHub error annotation too.
        run: |
          set -o pipefail
          if npx eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/tailzu.ipa" --non-interactive 2>&1 | tee "$RUNNER_TEMP/submit.log"; then
            exit 0
          fi
          msg=$(grep -iE "error|fail|credential|api key|authenticat|unable|invalid|provide|not found" "$RUNNER_TEMP/submit.log" | tail -n 6 | tr '\n' ' ' | cut -c1-900)
          echo "::error title=TestFlight submit failed::${msg:-see the job log}"
          exit 1

  android:
    needs: gate
    if: needs.gate.outputs.ok == 'true' && github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The runner's disk is small for a native Android build; drop the
      # toolchains it will never use (the Android SDK stays).
      - name: Room on disk
        if: inputs.builder == 'github'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build on Expo's cloud
        if: inputs.builder == 'expo'
        working-directory: app
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --no-wait

      - uses: actions/setup-java@v4
        if: inputs.builder == 'github'
        with:
          distribution: temurin
          java-version: 17

      - name: Build on this runner
        if: inputs.builder == 'github'
        working-directory: app
        run: npx eas-cli@latest build --platform android --profile production --local --non-interactive --output "$RUNNER_TEMP/tailzu.aab"

      # Download it from this run's page and upload it in Play Console.
      - uses: actions/upload-artifact@v4
        if: inputs.builder == 'github'
        with:
          name: tailzu-android
          path: ${{ runner.temp }}/tailzu.aab
          retention-days: 7
          if-no-files-found: error
