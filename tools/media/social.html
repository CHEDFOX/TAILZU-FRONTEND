<!doctype html>
<!--
  TAILZU, FOR SOCIAL. Films and posters for Reels, Shorts, the feed and
  promotions, drawn from time on a canvas so the render is the design.

  The site's own language, not a campaign's: its violet field and colour
  rooms, Newsreader for what is written, a hand for what is said, IBM Plex
  Mono for labels. Amber only where something is live or just born: the
  word the river is pouring into, the mark just written, the mic while it
  listens. Every sentence is one the product already shows (SITE_UI).

    ?render=film&id=<film>&w=&h=     window.__frame(t) draws it
    ?render=poster&id=<poster>&w=&h=
    (no query)                       every film playing, every poster, for review

  Rendered by render-social.mjs into tools/media/promo.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailzu social</title>
<style>
  body { margin: 0; background: #0B0A09; color: #F3E2C6; font: 14px/1.5 "IBM Plex Mono", monospace; }
  body.render { background: #000; }
  canvas { display: block; }
  .wall { display: flex; flex-wrap: wrap; gap: 28px; padding: 28px; align-items: flex-start; }
  .wall figure { margin: 0; }
  .wall figcaption { margin-top: 8px; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; opacity: .6; }
</style>
</head>
<body>
<script>
(function () {
"use strict";

// ---- MATH ----------------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  soft: t => t * t * (3 - 2 * t),
};
function rng(seed) { let s = (Math.imul(seed | 0, 2654435761) >>> 0) || 7; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const n1 = (x, s = 0) => Math.sin(x * 1.3 + s) * .5 + Math.sin(x * 2.71 + s * 1.7 + 1.2) * .3 + Math.sin(x * 5.13 + s * .31 + 2.3) * .2;

// ---- COLOUR --------------------------------------------------------------------
const P = {
  ink: "#0F0D0B", wash: "#141110", card: "#211C17", pale: "#F3E2C6", amber: "#E8A23C", key: "#F4F1EA",
  violet: "#1C1640", violetHi: "#241C52", violetLo: "#0F0B24",
  paper: "#FBF8F2", ink2: "#1B1712", saffron: "#F4A72C", saffronDeep: "#B8650C",
  indigo: "#2A2878", indigoDeep: "#17163F", teal: "#167D71", tealDeep: "#0C4F47", sun: "#F7CF4A", rose: "#E4587B",
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${clamp(a)})`; };
const mix = (h1, h2, t) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const ch = s => Math.round(lerp(a >> s & 255, b >> s & 255, clamp(t))); return `#${((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1)}`; };

// ---- TYPE ----------------------------------------------------------------------
const SCRIPTS = '"Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam","Noto Sans Gujarati","Noto Sans Gurmukhi","Noto Sans Oriya","Noto Naskh Arabic","Noto Sans Ol Chiki","Noto Sans Meetei Mayek","Noto Sans JP","Noto Sans KR","Noto Sans SC"';
const SERIF = `"Newsreader",${SCRIPTS},Georgia,serif`;
const HAND = `"Caveat",${SCRIPTS},cursive`;
const MONO = `"IBM Plex Mono",monospace`;
const SANS = `"Instrument Sans",${SCRIPTS},system-ui,sans-serif`;
const f = (px, fam = SERIF, weight = 400, italic = false) => `${italic ? "italic " : ""}${weight} ${Math.max(1, px)}px ${fam}`;

/** Lay a sentence out character by character, wrapped to maxW. Indices line
 *  up with the original string: the space a line break eats is kept as a
 *  zero-width character, so an alignment made on strings maps onto glyphs. */
function layout(ctx, text, font, maxW, lineH, align = "left", tracking = 0) {
  ctx.save(); ctx.font = font; ctx.letterSpacing = `${tracking}px`;
  const words = text.split(" "), lines = []; let line = "";
  for (const wd of words) { const test = line ? line + " " + wd : wd; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = wd; } else line = test; }
  if (line) lines.push(line);
  const chars = []; let width = 0;
  lines.forEach((ln, li) => {
    const lw = ctx.measureText(ln).width; width = Math.max(width, lw);
    const x0 = align === "center" ? -lw / 2 : 0;
    for (let k = 0; k < ln.length; k++) chars.push({ ch: ln[k], x: x0 + ctx.measureText(ln.slice(0, k)).width, y: li * lineH });
    if (li < lines.length - 1) chars.push({ ch: " ", x: x0 + lw, y: li * lineH });
  });
  ctx.restore();
  return { chars, lines, width, height: lines.length * lineH, font };
}

/** Which characters of `a` become which of `b`: an edit alignment, so kept
 *  letters travel, filler falls away, typos flip and punctuation arrives. */
function align(a, b) {
  const A = a.toLowerCase(), B = b.toLowerCase(), n = A.length, m = B.length;
  const d = Array.from({ length: n + 1 }, (_, i) => { const r = new Array(m + 1).fill(0); r[0] = i; return r; });
  for (let j = 0; j <= m; j++) d[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (A[i - 1] === B[j - 1] ? 0 : 1.4));
  const out = []; let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (A[i - 1] === B[j - 1] ? 0 : 1.4)) { out.push([i - 1, j - 1]); i--; j--; }
    else if (i > 0 && d[i][j] === d[i - 1][j] + 1) { out.push([i - 1, -1]); i--; }
    else { out.push([-1, j - 1]); j--; }
  }
  return out.reverse();
}

// ---- LIGHT AND FILM ------------------------------------------------------------
function glow(ctx, x, y, r, color, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(color, a)); g.addColorStop(1, rgba(color, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function field(ctx, w, h, top, bottom, angle = 0.25) {
  const g = ctx.createLinearGradient(w * angle, 0, w * (1 - angle), h); g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}
function vignette(ctx, w, h, a = .45) {
  const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .35, w / 2, h / 2, Math.hypot(w, h) * .62);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}
let NOISE = null;
function grain(ctx, w, h, a, t) {
  if (!NOISE) {
    NOISE = document.createElement("canvas"); NOISE.width = NOISE.height = 384;
    const g = NOISE.getContext("2d"), im = g.createImageData(384, 384), r = rng(91);
    for (let i = 0; i < im.data.length; i += 4) { const v = r(); const on = v > .5; im.data[i] = im.data[i + 1] = im.data[i + 2] = on ? 243 : 0; im.data[i + 3] = Math.round(Math.abs(v - .5) * 2 * 255 * (r() < .5 ? 1 : 0)); }
    g.putImageData(im, 0, 0);
  }
  const fr = Math.floor(t * 24), r = rng(fr * 7 + 3), ox = -Math.floor(r() * 384), oy = -Math.floor(r() * 384);
  ctx.save(); ctx.globalAlpha = a;
  for (let y = oy; y < h; y += 384) for (let x = ox; x < w; x += 384) ctx.drawImage(NOISE, x, y);
  ctx.restore();
}
/** A slow push in, the way a camera breathes. */
function push(ctx, w, h, t, dur, amt = .035) { const s = 1 + amt * E.soft(clamp(t / dur)); ctx.translate(w / 2, h / 2); ctx.scale(s, s); ctx.translate(-w / 2, -h / 2); }

// ---- THE MARK ------------------------------------------------------------------
const MK = { sq: [[308, 269], [558, 478], [178, 598]], l1: [346, 402, 270, 598], link: [444, 394, 554, 486], l2: [668, 478, 828, 243] };
/** The mark, assembling: squares first, the lines drawn between them, the
 *  amber link last — the only amber that is the brand's own. p: 0..1. */
function mark(ctx, cx, cy, W, p = 1, alpha = 1, sq = P.key) {
  const s = W / 680, M = (x, y) => [cx + (x - 510) * s, cy + (y - 484) * s];
  ctx.save(); alpha *= ctx.globalAlpha; ctx.globalAlpha = alpha; ctx.lineCap = "round";
  const line = (l, q, color, width, dash) => {
    if (!(q > 0)) return; const [ax, ay] = M(l[0], l[1]), [bx, by] = M(l[2], l[3]);
    ctx.strokeStyle = color; ctx.lineWidth = width * s; ctx.setLineDash(dash ? dash.map(d => d * s) : []);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lerp(ax, bx, q), lerp(ay, by, q)); ctx.stroke(); ctx.setLineDash([]);
  };
  line(MK.l1, E.out(seg(p, .35, .7)), "#E9CBA2", 9);
  line(MK.l2, E.out(seg(p, .45, .8)), "#C77A3A", 9);
  const dot = E.out(seg(p, .7, .85)); if (dot > 0) { const [dx, dy] = M(828, 243); ctx.fillStyle = "#B06240"; ctx.beginPath(); ctx.arc(dx, dy, 11 * s * dot, 0, TAU); ctx.fill(); }
  line(MK.link, E.out(seg(p, .72, 1)), P.amber, 30, [9, 11]);
  MK.sq.forEach(([x, y], i) => {
    const q = E.out(seg(p, i * .09, i * .09 + .35)); if (!(q > 0)) return;
    const [sx, sy] = M(x + 66, y + 66), sz = 132 * s * lerp(.55, 1, q);
    ctx.globalAlpha = alpha * q; ctx.fillStyle = sq; rr(ctx, sx - sz / 2, sy - sz / 2, sz, sz, 28 * s); ctx.fill(); ctx.globalAlpha = alpha;
  });
  ctx.restore();
}
function rr(ctx, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---- WORDS ----------------------------------------------------------------------
function text(ctx, s, x, y, font, color, a = 1, alignH = "left", tracking = 0) {
  ctx.save(); ctx.font = font; ctx.fillStyle = color; ctx.globalAlpha *= clamp(a); ctx.textAlign = alignH; ctx.textBaseline = "alphabetic";
  if (tracking) ctx.letterSpacing = `${tracking}px`;
  ctx.fillText(s, x, y); ctx.restore();
}
/** A label: small, tracked, uppercase. */
const label = (ctx, s, x, y, size, color, a = 1, alignH = "left") => text(ctx, s.toUpperCase(), x, y, f(size, MONO), color, a, alignH, size * .22);
/** Words arrive with weight: from below, out of a blur, a word at a time. */
function arrive(ctx, s, x, y, font, color, t0, t, opt = {}) {
  const words = s.split(" "); ctx.save(); const base = ctx.globalAlpha; ctx.font = font; ctx.textBaseline = "alphabetic";
  const total = ctx.measureText(s).width; let cx = opt.align === "center" ? x - total / 2 : opt.align === "right" ? x - total : x;
  const size = parseFloat(font.match(/(\d+(\.\d+)?)px/)[1]);
  words.forEach((wd, i) => {
    const k = E.expo(seg(t, t0 + i * (opt.stagger ?? .08), t0 + i * (opt.stagger ?? .08) + (opt.dur ?? .7)));
    const out = opt.out != null ? E.in(seg(t, opt.out + i * .03, opt.out + i * .03 + .45)) : 0;
    const a = k * (1 - out); if (a > .002) {
      ctx.globalAlpha = base * a * (opt.alpha ?? 1); ctx.fillStyle = (opt.amberLast && i === words.length - 1 && k < 1) ? mix(P.amber, color, k) : color;
      ctx.filter = (k < .98 || out > 0) ? `blur(${((1 - k) + out) * size * .06}px)` : "none";
      ctx.fillText(wd, cx, y + (1 - k) * size * .28 - out * size * .22);
    }
    cx += ctx.measureText(wd + " ").width;
  });
  ctx.restore();
}
/** A hand writing: each character inks in a beat after the last. */
function handwrite(ctx, lay, ox, oy, color, t0, t, rate = .038, a = 1) {
  ctx.save(); const base = ctx.globalAlpha; ctx.font = lay.font; ctx.fillStyle = color; ctx.textBaseline = "alphabetic";
  const size = parseFloat(lay.font.match(/(\d+(\.\d+)?)px/)[1]);
  lay.chars.forEach((c, i) => {
    const k = E.out(seg(t, t0 + i * rate, t0 + i * rate + .22)); if (k <= 0) return;
    ctx.globalAlpha = base * k * a; ctx.fillText(c.ch, ox + c.x, oy + c.y + (1 - k) * size * .12);
  });
  ctx.restore();
}
/**
 * SAID, THEN WRITTEN. The hand's characters travel to where the type's go
 * and become it: kept letters glide and change face, filler falls away, a
 * wrong letter turns over into the right one, punctuation arrives. The one
 * mark born last is amber, then settles.
 */
function morph(ctx, said, wrote, sx, sy, tx, ty, t, o) {
  const pairs = o.pairs;
  const sz1 = parseFloat(said.font.match(/(\d+(\.\d+)?)px/)[1]), sz2 = parseFloat(wrote.font.match(/(\d+(\.\d+)?)px/)[1]);
  const lastJ = wrote.chars.length - 1;
  ctx.save(); const base = ctx.globalAlpha; ctx.textBaseline = "alphabetic";
  const A = (x) => { ctx.globalAlpha = base * clamp(x); };
  pairs.forEach(([i, j], k) => {
    // Filler leaves first, all at once; then the kept letters travel, a
    // ripple left to right; what is new arrives as they land.
    const d = .3 + k * (o.stagger ?? .006), local = E.io(seg(t, d, d + (o.span ?? .62)));
    if (i >= 0 && j >= 0) {
      const a = said.chars[i], b = wrote.chars[j], same = a.ch === b.ch;
      const x = lerp(sx + a.x, tx + b.x, local), y = lerp(sy + a.y, ty + b.y, local);
      const sz = lerp(sz1, sz2, local);
      if (same || a.ch.toLowerCase() === b.ch.toLowerCase()) {
        ctx.font = f(sz, HAND, 600); ctx.fillStyle = o.saidColor; A(1 - E.soft(local)); ctx.fillText(a.ch, x, y);
        ctx.font = f(sz, o.writtenFamily ?? SERIF, o.writtenWeight ?? 400); ctx.fillStyle = o.writtenColor; A(E.soft(local)); ctx.fillText(b.ch, x, y);
      } else {
        // A wrong letter turns over: the old drops away, the right one rises.
        ctx.font = f(sz, HAND, 600); ctx.fillStyle = o.saidColor; A(1 - E.soft(local)); ctx.fillText(a.ch, x, y + local * sz * .35);
        ctx.font = f(sz, o.writtenFamily ?? SERIF, o.writtenWeight ?? 400); ctx.fillStyle = mix(P.amber, o.writtenColor, seg(t, d + .6, d + 1.4)); A(E.soft(local)); ctx.fillText(b.ch, x, y - (1 - local) * sz * .35);
      }
    } else if (i >= 0) {
      const a = said.chars[i]; const fall = E.in(seg(t, i * .004, i * .004 + .5));
      ctx.font = f(sz1, HAND, 600); ctx.fillStyle = o.saidColor; A((1 - fall) * .9);
      ctx.filter = fall > .05 ? `blur(${fall * 6}px)` : "none";
      ctx.fillText(a.ch, sx + a.x + Math.sin(i * 1.7) * fall * 30, sy + a.y + fall * sz1 * 1.6); ctx.filter = "none";
    } else {
      const b = wrote.chars[j], born = j === lastJ;
      const k2 = E.out(seg(t, d + .15, d + .15 + .5));
      ctx.font = f(sz2, o.writtenFamily ?? SERIF, o.writtenWeight ?? 400);
      ctx.fillStyle = born ? mix(P.amber, o.writtenColor, seg(t, (o.settle ?? 2.2), (o.settle ?? 2.2) + .8)) : o.writtenColor;
      A(k2); ctx.fillText(b.ch, tx + b.x, ty + b.y + (1 - k2) * sz2 * .3);
    }
  });
  ctx.restore();
}

/** The last beat of every film: the mark assembles, the line, the address. */
function endCard(ctx, w, h, t, o = {}) {
  const u = Math.min(w, h), color = o.color ?? P.pale, cy = h * (o.y ?? .47);
  mark(ctx, w / 2, cy - u * .16, u * .2, E.out(seg(t, 0, 1.1)));
  arrive(ctx, o.line ?? "Talk. It writes.", w / 2, cy + u * .07, f(u * .085, SERIF, 300), color, .55, t, { align: "center", stagger: .1 });
  label(ctx, "tailzu.space", w / 2, cy + u * .17, u * .024, color, E.out(seg(t, 1.1, 1.7)) * .7, "center");
  label(ctx, "iPhone · Android · Windows · Mac", w / 2, h - u * .07, u * .018, color, E.out(seg(t, 1.3, 1.9)) * .45, "center");
}

// ---- THE FILMS ------------------------------------------------------------------
const FILMS = {};

/**
 * HEARD. The site's first screen, as a film: speech in every script pours in
 * along curves from every edge and is swallowed by one word, and the word
 * turns over as the sentence is heard, meant, written, sent.
 */
FILMS.river = { w: 1080, h: 1920, duration: 15, draw(ctx, t, w, h) {
  field(ctx, w, h, P.violetHi, P.violetLo, .1);
  glow(ctx, w * .5, h * .5, w * .9, P.pale, .06);
  ctx.save(); push(ctx, w, h, t, 15, .05);
  const words = ["Heard.", "Meant.", "Written.", "Sent."], slot = [[1.2, 4.2], [4.2, 6.9], [6.9, 9.6], [9.6, 12.2]];
  // The word is set from a fixed left edge, so the gate the river pours into
  // never moves when the word turns over.
  const wordSize = w * .17, gy = h * .53, gx = w * .33;
  // The river. Three depths: far and blurred, near and sharp.
  const pour = clamp(t / 1.4) * (1 - E.in(seg(t, 10.6, 12.2)));
  const speed = 1 + 1.8 * E.io(seg(t, 3, 10));
  const layers = [{ n: 26, size: w * .024, blur: 3.2, a: .26 }, { n: 18, size: w * .032, blur: 1.2, a: .46 }, { n: 9, size: w * .042, blur: 0, a: .82 }];
  if (!FILMS.river.buf) FILMS.river.buf = layers.map(() => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; });
  layers.forEach((L, li) => {
    const c = FILMS.river.buf[li], g = c.getContext("2d"); g.clearRect(0, 0, w, h); g.textBaseline = "middle";
    const r = rng(li * 131 + 7);
    for (let k = 0; k < L.n; k++) {
      const side = r(), phrase = RIVER[Math.floor(r() * RIVER.length)], ph = r(), sp = .06 + r() * .045;
      // From the left edge anywhere down the frame, or from the top and the
      // bottom on the left; always arriving level, across the height of the
      // first letter, never onto one point.
      const P0 = side < .82 ? [-w * (.08 + r() * .3), h * (.05 + r() * .9)] : side < .91 ? [w * r() * .15, -h * .07] : [w * r() * .15, h * 1.07];
      const P3 = [gx - w * (.005 + r() * .05), gy - wordSize * .62 + r() * wordSize * .66];

  "noto-sans-gujarati/400", "noto-sans-gurmukhi/400", "noto-sans-oriya/400", "noto-naskh-arabic/400", "noto-sans-ol-chiki/400", "noto-sans-meetei-mayek/400",
