<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailzu Motion</title>
<meta name="description" content="The way into Tailzu, screen by screen, with its films and posters: the words themselves.">
<!--
  THE WORDS THEMSELVES — the media the app carries, and the screens it sits in.

  Tailzu makes sentences: in your language, spelled the way you speak. So the
  art is typography, live. The sign-in greets in the scripts the app already
  greets in, each writing itself. The mic screen dictates a sentence word by
  word. The keyboard screen draws the keyboard exactly and lets the keys
  leave. Every voice's poster is that voice's own sentence.

  Every screen here is built at its true size in the app's own construction
  and scaled, so the media is judged where it lives. Every film and poster is
  drawn from time on a canvas; the same function previews here and renders
  the MP4s and PNGs the app is served (tools/media/render.mjs). The renderer
  reads its type from node_modules (see package.json); the page, when viewed,
  from Google Fonts. The opening film is unchanged.

  Amber is the app's rule: the caret while the mic is open, the words just
  born. Nothing else is amber.

  ?render=film&id=auth&w=1080&h=2340    one canvas, window.__frame(t) draws it
  ?render=poster&id=signature&w=1200&h=560
-->
<style>
  :root { --ink: #0B0A09; --pale: #F3E2C6; --grey: rgba(243,226,198,.6); --dim: rgba(243,226,198,.42); --rule: rgba(243,226,198,.1); --amber: #E8A23C;
          --display: 'Newsreader', Georgia, 'Times New Roman', serif; --ui: Georgia, 'Times New Roman', serif; --sans: -apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--pale); }
  body { font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  body.render { overflow: hidden; } body.render canvas { display: block; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  header { padding: 72px 0 36px; }
  .eye { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); margin: 0 0 18px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 6.5vw, 76px); line-height: 1; letter-spacing: -.025em; margin: 0 0 18px; text-wrap: balance; }
  .lede { color: var(--grey); max-width: 58ch; margin: 0; font-size: 17px; line-height: 1.6; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 34px; letter-spacing: -.015em; margin: 84px 0 8px; }
  .sub { color: var(--grey); margin: 0 0 30px; max-width: 66ch; }
  .scene { display: grid; grid-template-columns: 250px 1fr; gap: 32px; align-items: start; padding: 0 0 56px; margin: 0 0 56px; border-bottom: 1px solid var(--rule); }
  .scene h3 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0 0 8px; }
  .scene p { color: var(--grey); margin: 0 0 12px; }
  .meta { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); line-height: 1.8; }
  .devices { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; }
  .phone { width: 296px; height: 640px; flex: none; position: relative; }
  .phone .bezel { position: absolute; inset: 0; border-radius: 46px; background: #050505; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #2a2725, inset 0 0 0 5px #0a0a0a; }
  .phone .screen { position: absolute; left: 8px; top: 8px; width: 390px; height: 844px; transform: scale(.7179); transform-origin: 0 0; border-radius: 52px; overflow: hidden; background: #000; }
  .desk { width: 520px; height: 362px; flex: none; position: relative; }
  .desk .bezel { position: absolute; inset: 0; border-radius: 12px; background: #0c0b0a; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px #2a2725; }
  .desk .screen { position: absolute; left: 1px; top: 1px; width: 1120px; height: 780px; transform: scale(.4625); transform-origin: 0 0; border-radius: 22px; overflow: hidden; background: #000; }
  .desk .bar { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: #121110; border-bottom: 1px solid #1e1c1a; z-index: 3; }
  .desk .bar i { position: absolute; top: 14px; width: 12px; height: 12px; border-radius: 6px; background: #2c2a28; } .desk .bar i:nth-child(1) { left: 16px; } .desk .bar i:nth-child(2) { left: 36px; } .desk .bar i:nth-child(3) { left: 56px; }
  canvas.film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px; font: 600 15px/1 var(--sans); color: #fff; z-index: 5; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: rgba(255,255,255,.85); z-index: 5; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.42); }
  .brand { position: absolute; left: 28px; right: 28px; top: 72px; }
  .brand b { display: block; font: 400 34px/1 var(--ui); color: #fff; letter-spacing: -.01em; }
  .brand span { display: block; margin-top: 6px; font-size: 14px; color: rgba(255,255,255,.62); }
  .signin { position: absolute; left: 28px; right: 28px; bottom: 42px; }
  .spill { height: 64px; border-radius: 999px; background: #F4F4F2; padding: 6px; display: flex; align-items: center; margin-bottom: 12px; box-shadow: 0 8px 18px rgba(0,0,0,.34); }
  .spill i { width: 52px; height: 52px; border-radius: 26px; background: #0D0D0F; flex: none; position: relative; } .spill i::after { content: ""; position: absolute; left: 21px; top: 20px; width: 8px; height: 8px; border-right: 2px solid #fff; border-top: 2px solid #fff; transform: rotate(45deg); }
  .spill span { flex: 1; text-align: center; font-size: 16px; font-weight: 500; color: #0D0D0F; letter-spacing: .1px; margin-right: 52px; }
  .social { display: flex; justify-content: center; gap: 16px; margin: 22px 0 0; } .social i { width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); display: block; }
  .legal { margin: 18px 0 0; text-align: center; font-size: 10.5px; color: rgba(255,255,255,.4); }
  .deskform { position: absolute; top: 40px; bottom: 0; right: 0; width: 46%; display: flex; flex-direction: column; justify-content: center; padding: 0 110px 0 60px; }
  .deskform .brand, .deskform .signin { position: static; }
  .ob { position: absolute; inset: 0; padding: 76px 28px 48px; display: flex; flex-direction: column; align-items: center; }
  .ob .title { font: 400 34px/42px var(--ui); color: #fff; text-align: center; letter-spacing: -.01em; }
  .ob .title b { color: var(--amber); font-weight: 400; }
  .ob .mid { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
  .ob .mid canvas { display: block; }
  .ob .line { font-size: 13px; line-height: 21px; color: rgba(255,255,255,.62); text-align: center; margin: 0 0 21px; }
  .allow { width: 100%; height: 64px; border-radius: 999px; background: #F4F4F2; padding: 6px; display: flex; align-items: center; box-shadow: 0 8px 18px rgba(0,0,0,.34); }
  .allow em { width: 54px; height: 100%; display: flex; align-items: center; justify-content: center; font-style: normal; color: #141416; font-size: 20px; }
  .allow span { flex: 1; height: 52px; border-radius: 26px; background: #0D0D0F; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; letter-spacing: .1px; }
  .kb { position: absolute; inset: 0; padding: 62px 28px 48px; overflow: hidden; display: flex; flex-direction: column; }
  .kb .title { font: 400 34px/42px var(--ui); color: #fff; margin: 0 0 24px; }
  .kb .hero { width: 100%; aspect-ratio: 1080 / 1400; border-radius: 0; overflow: hidden; position: relative; margin: 0 0 24px; flex: none; }
  .steps { border: 1px solid var(--amber); border-radius: 12px; padding: 11px 12px; }
  .steps .t { font-size: 12.5px; line-height: 18px; color: #fff; margin: 0 0 11px; }
  .steps .s { display: flex; gap: 6px; font-size: 11.5px; line-height: 16px; color: rgba(255,255,255,.72); margin: 0 0 10px; } .steps .s b { width: 12px; font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.45); flex: none; }
  .kb .allow { margin-top: auto; flex: none; }
  .you { position: absolute; inset: 0; padding: 62px 18px 0; }
  .greet { display: flex; justify-content: space-between; align-items: flex-start; margin: 0 0 10px; }
  .greet .h { font: italic 400 15px/18px var(--ui); color: rgba(255,255,255,.5); }
  .greet .n { font: 800 30px/34px var(--ui); color: #fff; margin-top: 2px; }
  .gear { width: 38px; height: 38px; border-radius: 19px; background: rgba(255,255,255,.06); position: relative; } .gear::after { content: ""; position: absolute; left: 12px; top: 12px; width: 10px; height: 10px; border: 2px solid rgba(255,255,255,.6); border-radius: 50%; }
  .portrait { font: 400 21px/26px var(--ui); color: #fff; margin: 58px 0 32px; } .portrait i { color: var(--amber); }
  .card { height: 220px; border-radius: 22px; overflow: hidden; position: relative; background: #17161A; border: 1px solid rgba(255,255,255,.07); margin: 0 0 20px; }
  .card.train { height: 220px; background: #000; }
  .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .fall { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(232,162,60,.1), rgba(232,162,60,.03) 50%, rgba(0,0,0,0)); }
  .card.train .fall { background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.35) 45%, rgba(0,0,0,.78)); }
  .card .text { position: absolute; left: 20px; right: 20px; bottom: 20px; } .card.train .text { left: 18px; right: 18px; bottom: 18px; }
  .card .k { display: flex; align-items: center; gap: 8px; font-size: 8px; letter-spacing: 2.4px; text-transform: uppercase; color: rgba(255,255,255,.56); }
  .card .k i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .card .name { font: 800 34px/1 var(--ui); color: #fff; margin: 9px 0 0; }
  .card .tag { font-size: 13px; line-height: 18px; color: rgba(255,255,255,.56); margin: 9px 0 0; }
  .card.train .name { font: 300 26px/1 var(--sans); letter-spacing: -.3px; margin-top: 6px; } .card.train .tag { font-size: 12px; margin-top: 4px; }
  .card.train .btn { margin-top: 14px; height: 46px; border-radius: 23px; background: #F4F4F2; color: #0D0D0F; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; }
  .row { height: 68px; border-radius: 18px; background: rgba(255,255,255,.045); padding: 0 18px; display: flex; align-items: center; margin: 0 0 12px; }
  .row b { font-size: 15px; font-weight: 500; color: #fff; flex: 1; } .row span { font-size: 14.5px; color: rgba(255,255,255,.56); }
  .row i { width: 7px; height: 7px; border-right: 2.2px solid rgba(255,255,255,.3); border-top: 2.2px solid rgba(255,255,255,.3); transform: rotate(45deg); margin-left: 14px; }
  .dock { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .dock i { width: 58px; height: 58px; border-radius: 19px; background: rgba(30,30,32,.92); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.55); box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .dock i.on { background: rgba(52,52,56,.96); color: #fff; }
  .deskyou { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; padding: 22px 0 0; } .deskyou .col { width: 560px; margin: 0 auto; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(354px, 100%), 354px)); gap: 20px; }
  .gallery .card { width: 100%; max-width: 354px; margin: 0; }
  .files { margin: 24px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px 24px; font-size: 13px; color: var(--grey); }
  .files b { color: var(--pale); font-weight: 400; }
  footer { padding: 64px 0 88px; color: var(--dim); font-size: 13px; }
  @media (max-width: 900px) { .scene { grid-template-columns: 1fr; } .desk { width: 100%; max-width: 520px; aspect-ratio: 520 / 362; height: auto; } }
</style>
</head>
<body>
<script>
(function () {
"use strict";
const TAU = Math.PI * 2;
const C = { pale: "#F3E2C6", amber: "#E8A23C", key: "#F4F1EA", cream: "#FFF1D6", white: "#FFFFFF" };
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const E = { io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t,
  back: t => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };
const n1 = (x, s = 0) => Math.sin(x * 1.3 + s) * .5 + Math.sin(x * 2.71 + s * 1.7 + 1.2) * .3 + Math.sin(x * 5.13 + s * .31 + 2.3) * .2;
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${clamp(a)})`; };
const mix = (h1, h2, t) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const ch = s => Math.round(lerp(a >> s & 255, b >> s & 255, t)); return `#${((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1)}`; };
function rng(seed) { let s = (Math.imul(seed | 0, 2654435761) >>> 0) || 7; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function rrect(ctx, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ground(ctx, w, h, color = "#0F0D0B") { ctx.fillStyle = color; ctx.fillRect(0, 0, w, h); }
function glow(ctx, x, y, r, color, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(color, a)); g.addColorStop(1, rgba(color, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function grain(ctx, w, h, a, seed) { const r = rng(seed * 97 + 13), n = Math.round(w * h / 160); for (let i = 0; i < n; i++) { const x = r() * w, y = r() * h, k = r(); ctx.fillStyle = k < .5 ? `rgba(243,226,198,${a * (0.3 + k)})` : `rgba(0,0,0,${a * k})`; ctx.fillRect(x, y, 1, 1); } }
/** A stroke with a hand in it: a polyline through fn(u), width by w(u). The opening uses it. */
function ribbon(ctx, fn, wf, color, N = 160, alpha = 1) {
  ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = color; ctx.globalAlpha = alpha;
  let p = fn(0);
  for (let j = 1; j <= N; j++) { const u = j / N, q = fn(u); ctx.lineWidth = Math.max(0.5, wf(u)); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); p = q; }
  ctx.restore();
}

// ---- TYPE --------------------------------------------------------------------
const F = '"Newsreader","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil","Noto Naskh Arabic","Noto Sans JP","Noto Sans KR","Noto Sans SC",Georgia,serif';
const font = (px, o = {}) => `${o.italic ? "italic " : ""}${o.weight || 400} ${px}px ${o.family || F}`;
function wrap(ctx, text, maxW) {
  const words = text.split(" "), lines = []; let line = "";
  for (const wd of words) { const test = line ? line + " " + wd : wd; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = wd; } else line = test; }
  if (line) lines.push(line); return lines;
}
/** The greetings the app itself cycles through on the You tab. */
const HELLOS = ["Hello", "नमस्ते", "Hola", "你好", "Bonjour", "مرحبا", "こんにちは", "নমস্কার", "வணக்கம்", "안녕하세요"];
const SAID = [
  "Can you send the file tonight? It's fairly urgent.",
  "Main das minute late ho jaunga, tum order kar dena.",
];
/** The same request, in every voice: the catalog's own tone samples where it has them. */
const LINES = {
  signature: "Can you send the file tonight? It's fairly urgent.",
  professional: "Could you please send the file this evening? It is time-sensitive.",
  friendly: "Hey, could you send the file tonight? Kind of urgent.",
  witty: "Send the file tonight, or I'll assume it's travelling by boat.",
  concise: "File tonight, please. Urgent.",
  gentle: "Whenever you get a chance tonight, could you send the file? It's a little urgent.",
  playful: "Fiiile tonight?? Pretty urgent. No pressure. Some pressure.",
  romantic: "Send me the file tonight. I'll be waiting up.",
  "concise-boss": "File by tonight. Non-negotiable.",
  explainer: "Could you send the file tonight? The review starts tomorrow, so it's fairly urgent.",
  excited: "Can you send the file tonight?! I can't wait to dig in!",
  poetic: "Tonight, the file, before the lamps go out. It is fairly urgent.",
  bard: "Prithee, send the file ere night doth fall. 'Tis most urgent.",
  pirate: "Arr, send the file tonight, matey. It be urgent.",
  trailer: "One file. One night. And time is running out.",
  noir: "The file. Tonight. In this town, urgent means yesterday.",
  train: "I don't know how you sound yet. Just talk, and I'll listen.",
  dictionary: "Priya · Ramesh · Bengaluru · deploy · chai · Koramangala",
  languages: "नमस्ते · வணக்கம் · مرحبا · こんにちは · Hello",
  haptics: "Every key, felt.",
};
const ITALIC = new Set(["romantic", "poetic", "bard", "noir"]);
const FIELDS = {
  signature: ["#141110", "#050403"], professional: ["#1A1C2C", "#07070C"], friendly: ["#3A2410", "#120A03"], witty: ["#3A1020", "#100408"],
  concise: ["#0E0E0E", "#000000"], gentle: ["#152230", "#060A0F"], playful: ["#33280A", "#0F0B02"], romantic: ["#3E1226", "#12040B"],
  "concise-boss": ["#0C0C0C", "#000000"], explainer: ["#0E4C46", "#03201D"], excited: ["#4A2606", "#150A02"], poetic: ["#241C4A", "#0B0818"],
  bard: ["#26246E", "#0B0A28"], pirate: ["#08302C", "#020E0D"], trailer: ["#0A0A0A", "#000000"], noir: ["#0C0C0C", "#000000"], train: ["#0B0A09", "#000000"],
  dictionary: ["#1E1712", "#070504"], languages: ["#1C1640", "#0B0818"], haptics: ["#1A2226", "#06090A"],
};

// ---- THE MARK, from the site's own geometry (viewBox 170 228 680 512) ------
const MARK = { sq: [[308, 269], [558, 478], [178, 598]], l1: [346, 402, 270, 598], link: [444, 394, 554, 486], l2: [668, 478, 828, 243] };
const markMap = (cx, cy, s) => (x, y) => [cx + (x - 510) * s, cy + (y - 484) * s];
function drawMark(ctx, cx, cy, W, p) {
  const s = W / 680, M = markMap(cx, cy, s);
  ctx.save(); ctx.globalAlpha = p.alpha ?? 1;
  const line = (l, prog, color, width, dash) => {
    if (!(prog > 0)) return; const [ax, ay] = M(l[0], l[1]), [bx, by] = M(l[2], l[3]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lerp(ax, bx, prog), lerp(ay, by, prog));
    ctx.strokeStyle = color; ctx.lineWidth = width * s; ctx.lineCap = dash ? "butt" : "round"; ctx.setLineDash(dash ? dash.map(d => d * s) : []); ctx.stroke(); ctx.setLineDash([]);
  };
  line(MARK.l1, p.l1, "#E9CBA2", 9); line(MARK.l2, p.l2, "#C77A3A", 9);
  if (p.link > 0) { const [ax, ay] = M(444, 394), [bx, by] = M(554, 486); glow(ctx, lerp(ax, bx, .5), lerp(ay, by, .5), 90 * s, C.amber, .22 * p.link); }
  line(MARK.link, p.link, C.amber, 30, [9, 11]);
  if (p.dot > 0) { const [dx, dy] = M(828, 243); ctx.beginPath(); ctx.arc(dx, dy, 11 * s * E.back(p.dot), 0, TAU); ctx.fillStyle = "#B06240"; ctx.fill(); }
  MARK.sq.forEach(([x, y], i) => { const k = p.sq ? p.sq[i] : 1; if (!(k > 0)) return; const [px, py] = M(x + 66, y + 66), sz = 132 * s * E.back(k); rrect(ctx, px - sz / 2, py - sz / 2, sz, sz, 28 * s * E.back(k)); ctx.fillStyle = C.key; ctx.fill(); });
  ctx.restore();
}

// ---- THE POSTERS: the voice, in its own words -------------------------------
function poster(ctx, w, h, id) {
  const [a, b] = FIELDS[id] || FIELDS.signature, line = LINES[id] || LINES.signature;
  const g = ctx.createLinearGradient(0, 0, w * 0.3, h); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // The card's own words live in its bottom half (its kicker starts 55% down
  // a voice card, 34% down the training card), and a window crops the top
  // fifth: the sentence sits in the band between, two lines at most.
  const train = id === "train", inset = w * 0.06, maxW = w - inset * 2, top = h * 0.2, italic = ITALIC.has(id);
  const bandH = h * (train ? 0.13 : 0.32);
  let size = Math.round(w * (train ? 0.038 : 0.07)), lines;
  for (;;) { ctx.font = font(size, { italic }); lines = wrap(ctx, line, maxW); if ((lines.length <= 2 && size * (0.95 + 1.18 * (lines.length - 1)) <= bandH) || size <= 30) break; size -= 3; }
  const lh = size * 1.18;
  ctx.fillStyle = rgba(C.pale, 0.22); ctx.fillRect(inset, top - size * 0.35, w * 0.16, 1);
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left"; ctx.letterSpacing = "-0.01em";

    const c = el.querySelector("canvas"), w = el.clientWidth, h = el.clientHeight, train = el.dataset.poster === "train", pw = 1200, ph = 750;
    const off = document.createElement("canvas"); off.width = pw; off.height = ph; poster(off.getContext("2d"), pw, ph, el.dataset.poster);
    const ctx = fit(c, w, h, dpr), sc = Math.max(w / pw, h / ph), dw = pw * sc, dh = ph * sc;
    ctx.drawImage(off, (w - dw) / 2 * dpr, (h - dh) / 2 * dpr, dw * dpr, dh * dpr);
  });
  const live = [];

    const w = +c.dataset.w || c.parentElement.clientWidth, h = +c.dataset.h || c.parentElement.clientHeight;

  });

    for (const f of live) { const F = FILMS[f.id]; f.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); F.draw(f.ctx, reduced ? 3.5 : (F.loop ? t % F.duration : Math.min(F.duration, t % (F.duration + 1.6))), f.w, f.h); }

  }
