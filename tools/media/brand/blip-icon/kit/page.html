<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#fff">
<script src="./blipFigure.js"></script>
<script>
// KIT: Blip's real figure (BF = app/src/onboard/blipFigure.ts, bundled) plus the dither,
// generalised so any drawing can be turned into Blip-style dots.
(() => {
  const TAU = Math.PI * 2;
  const cv = document.createElement("canvas");
  const raster = {
    begin(bw, bh) { cv.width = bw; cv.height = bh; const g = cv.getContext("2d", { willReadFrequently: true }); g.clearRect(0, 0, bw, bh); return g; },
    pixels() { return cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; },
  };
  /** A still figure state for a pose, with overrides (tilt, brows, look:[x,y], mouth "grin"|"smile", ra, la, thumb, point). */
  function state(pose = "present", over = {}) {
    const S = BF.poseOf(pose);
    return Object.assign({
      ra: [S.ra0, S.ra1], la: [S.la0, S.la1], brows: S.brows, tilt: S.tilt,
      mouth: S.grin > .5 ? "grin" : "smile", legs: [{ th: 0, lift: 0 }, { th: 0, lift: 0 }],
      drop: 0, bob: 0, swayK: 0, antWob: 0, walkK: 0, look: [S.lx, S.ly], thumb: S.thumb, point: S.point,
    }, over);
  }
  /** Blip's own figure, in greys, into a .84H by H box whose top-left is (0,0). */
  function figure(g, H, st, t = .3125) { return BF.figure(g, H * .84, H, st, t); }
  /** Where his parts are, for drawing vector parts on top (same box as figure()). */
  function geo(H, st, t = .3125) {
    const W = H * .84, hx = W / 2, hy = .3 * H + st.bob + st.drop, R = .16 * H, rot = st.tilt;
    const px = hx, py = hy + R, c = Math.cos(rot), s = Math.sin(rot);
    const P = (x, y) => [px + (x - px) * c - (y - py) * s, py + (x - px) * s + (y - py) * c];
    const wob = Math.sin(t * TAU * 1.6) * .025 * H + st.antWob;
    return {
      W, H, rot, pivot: [px, py], R,
      head: { c: P(hx, hy), rx: R * 1.1, ry: R * .94 },
      eye: { c: P(hx - .005 * H, hy - .012 * H), r: .082 * H, ring: .011 * H, pupil: .036 * H },
      ball: { c: P(hx - .065 * H + wob, hy - R * 1.55), r: .024 * H },
      mouth: { c: P(hx + .035 * H, hy + .105 * H) },
      ears: [-1, 1].map((k) => P(hx + k * R * 1.1, hy)),
    };
  }
  /**
   * Blip's dither for any drawing: draw(g) paints greys in drawing units; the
   * region {x0,y0,w,h} is cut into cells of `cell` units. Returns the ink sticker
   * (every lit cell and its 8 neighbours) and the pale dots (cells whose
   * brightness beats the 8x8 Bayer threshold), as centres in drawing units, plus
   * the suggested radii the app uses (.64 and .46 of a cell). grid:true also
   * returns each cell's luminance and alpha (for size-graded halftones).
   */
  function dither(draw, { x0, y0, w, h, cell, grid = false, bayer = true }) {
    const bw = Math.ceil(w / cell), bh = Math.ceil(h / cell);
    const g = raster.begin(bw, bh);
    g.save(); g.scale(1 / cell, 1 / cell); g.translate(-x0, -y0); draw(g); g.restore();
    const src = raster.pixels(), on = new Uint8Array(bw * bh);
    for (let i = 0; i < bw * bh; i++) on[i] = src[i * 4 + 3] > 60 ? 1 : 0;
    const X = (x) => +(x0 + (x + .5) * cell).toFixed(2), Y = (y) => +(y0 + (y + .5) * cell).toFixed(2);
    const sticker = [], dots = [], lum = grid ? [] : null, alpha = grid ? [] : null;
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
      let hit = on[y * bw + x];
      for (let j = -1; j <= 1 && !hit; j++) for (let i = -1; i <= 1 && !hit; i++) {
        const xx = x + i, yy = y + j;
        if (xx >= 0 && yy >= 0 && xx < bw && yy < bh && on[yy * bw + xx]) hit = 1;
      }
      if (hit) sticker.push([X(x), Y(y)]);
      const k = (y * bw + x) * 4, a = src[k + 3];
      const l = (src[k] * .3 + src[k + 1] * .59 + src[k + 2] * .11) / 255 * (a / 255);
      if (grid) { lum.push(+l.toFixed(3)); alpha.push(a); }
      if (a >= 90 && (bayer ? l > (BF.BAYER[(y & 7) * 8 + (x & 7)] + .5) / 64 : true)) dots.push([X(x), Y(y), +l.toFixed(3)]);
    }
    return { cell, bw, bh, sticker, dots, stickerR: cell * .64, dotR: cell * .46, lum, alpha };
  }
  /** Circles as one compact path: <path d="..." fill="..."/>. pts are [x,y] or [x,y,r]. */
  function dotsPath(pts, r, k = 1, ox = 0, oy = 0) {
    let d = "";
    for (const p of pts) {
      const rr = (p.length > 2 && typeof p[3] === "number" ? p[3] : r) * k;
      const x = (p[0] - ox) * k, y = (p[1] - oy) * k;
      d += `M${(x - rr).toFixed(1)} ${y.toFixed(1)}a${rr.toFixed(1)} ${rr.toFixed(1)} 0 1 0 ${(2 * rr).toFixed(1)} 0a${rr.toFixed(1)} ${rr.toFixed(1)} 0 1 0 ${(-2 * rr).toFixed(1)} 0`;
    }
    return d;
  }
  window.KIT = { BF, state, figure, geo, dither, dotsPath, TAU };
  window.ready = true;
})();
</script></body></html>
